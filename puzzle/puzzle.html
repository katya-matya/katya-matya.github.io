<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пазл</title>
    
    <!-- Библиотеки -->
    <script src="createjs.js"></script>
    <script src="zim.js"></script>
    
    <style>
        /* Сообщение для мобильных устройств */
        .mobile-warning {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 0, 0.4);
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
        }
        
        @media screen and (max-width: 1366px) {
            .mobile-warning {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-warning">
        Если пазл не помещается на экране, уменьшите масштаб (Ctrl + колесико мыши или Ctrl + "-") и обновите страницу
    </div>

    <script>
        // Основные настройки
        const settings = {
            scaling: "full", // Режим масштабирования
            width: "100%",
            height: "100%",
            backgroundColor: "#398f3c",
            borderColor: "white"
        };

        // Параметры пазла
        const puzzleConfig = {
            defaultRows: 8,
            defaultCols: 8,
            pieceGap: 40 // Расстояние для "притягивания" кусочка
        };

        // Инициализация приложения
        const app = new Frame(settings.scaling, settings.width, settings.height);
        app.outerColor = settings.borderColor;
        app.color = settings.backgroundColor;

        let completedPieces = 0;
        let totalPieces = 0;
        let puzzleStartX = 0;
        let puzzleStartY = 0;

        app.on("ready", function() {
            const stage = app.stage;
            const stageWidth = app.width;
            const stageHeight = app.height;

            // Контейнер для всех элементов пазла
            const puzzleContainer = new Container();
            
            // Счетчик собранных кусочков
            const counter = new Label({
                text: "0/0",
                size: 40,
                font: "sans-serif",
                color: "black",
                fontOptions: "bold",
                x: 20,
                y: 20
            });
            stage.addChild(counter);

            // Загрузка изображения для пазла
            app.loadAssets(["bg.jpg"], "assets/");

            app.on("complete", function() {
                // Получаем загруженное изображение
                const originalImage = app.asset("bg.jpg").clone();
                originalImage.addTo(puzzleContainer);
                originalImage.alpha = 0.3; // Сделаем изображение полупрозрачным как подсказку

                // Параметры сетки пазла
                const queryParams = getQueryString();
                const rows = queryParams?.rows || puzzleConfig.defaultRows;
                const cols = queryParams?.cols || puzzleConfig.defaultCols;
                
                const imageWidth = originalImage.width;
                const imageHeight = originalImage.height;
                const pieceWidth = Math.round(imageWidth / cols);
                const pieceHeight = Math.round(imageHeight / rows);
                
                totalPieces = rows * cols;
                counter.text = `${completedPieces}/${totalPieces}`;

                // Позиция для сборки пазла (центр экрана)
                puzzleStartX = stageWidth / 2 - imageWidth / 2;
                puzzleStartY = stageHeight / 2 - imageHeight / 2;
                originalImage.pos(puzzleStartX, puzzleStartY);

                // Массив для хранения кусочков пазла
                const pieces = [];
                
                // Создаем кусочки пазла
                for (let row = 0; row < rows; row++) {
                    pieces[row] = [];
                    
                    for (let col = 0; col < cols; col++) {
                        const pieceIndex = col + row * cols;
                        
                        // Создаем уникальную форму для каждого кусочка
                        const piece = createPuzzlePiece({
                            row,
                            col,
                            rows,
                            cols,
                            pieceWidth,
                            pieceHeight,
                            pieceIndex,
                            image: originalImage.image,
                            offsetX: pieceWidth * col,
                            offsetY: pieceHeight * row,
                            neighbors: pieces
                        });
                        
                        // Добавляем кусочек в контейнер
                        piece.addTo(puzzleContainer);
                        
                        // Анимируем появление в случайной позиции
                        piece.animate({
                            obj: {
                                x: getRandomNumber(-pieceWidth * col, stageWidth - pieceWidth * col - pieceWidth),
                                y: getRandomNumber(-pieceHeight * row, stageHeight - pieceHeight * row - pieceHeight)
                            },
                            time: 500
                        });
                        
                        pieces[row][col] = piece;
                    }
                }
                
                puzzleContainer.addTo(stage);
                stage.update();
            });
        });

        /**
         * Создает один кусочек пазла
         */
        function createPuzzlePiece(params) {
            const { row, col, rows, cols, pieceWidth, pieceHeight, pieceIndex, image, offsetX, offsetY, neighbors } = params;
            
            // Определяем форму выступов и впадин
            const connections = {
                top: row > 0 ? 1 - neighbors[row - 1][col].connections.bottom : Math.random() > 0.5 ? 1 : 0,
                right: col < cols - 1 ? Math.random() > 0.5 ? 1 : 0 : 0,
                bottom: row < rows - 1 ? Math.random() > 0.5 ? 1 : 0 : 0,
                left: col > 0 ? 1 - neighbors[row][col - 1].connections.right : Math.random() > 0.5 ? 1 : 0
            };
            
            // Создаем графику кусочка
            const piece = new Shape();
            piece.name = `piece-${pieceIndex}`;
            piece.drag(); // Делаем перетаскиваемым
            
            // Обработка отпускания кусочка
            piece.addEventListener("pressup", function(event) {
                const droppedPiece = event.currentTarget;
                const pieceX = Math.round(droppedPiece.x);
                const pieceY = Math.round(droppedPiece.y);
                
                // Проверяем, попал ли кусочек в область сборки
                const isInPlace = (
                    pieceX > puzzleStartX - puzzleConfig.pieceGap / 2 &&
                    pieceX < puzzleStartX + puzzleConfig.pieceGap / 2 &&
                    pieceY > puzzleStartY - puzzleConfig.pieceGap / 2 &&
                    pieceY < puzzleStartY + puzzleConfig.pieceGap / 2
                );
                
                if (isInPlace) {
                    // Фиксируем кусочек на месте
                    droppedPiece.x = puzzleStartX;
                    droppedPiece.y = puzzleStartY;
                    droppedPiece.noDrag();
                    droppedPiece.mouseEnabled = false;
                    
                    // Скрываем подсказку
                    if (droppedPiece.hint) {
                        droppedPiece.hint.visible = false;
                    }
                    
                    // Обновляем счетчик
                    completedPieces++;
                    document.querySelector('.counter').textContent = `${completedPieces}/${totalPieces}`;
                    
                    // Проверяем, собран ли весь пазл
                    if (completedPieces === totalPieces) {
                        showCongratulations();
                    }
                    
                    app.stage.update();
                }
            });
            
            // Сохраняем информацию о соединениях
            piece.connections = connections;
            
            // Создаем визуальное представление кусочка
            drawPieceShape(piece, {
                offsetX,
                offsetY,
                pieceWidth,
                pieceHeight,
                connections,
                image
            });
            
            // Создаем подсказку (красный контур)
            const hint = new Shape();
            hint.mouseEnabled = false;
            hint.graphics = piece.graphics.clone(true);
            hint.pos(puzzleStartX, puzzleStartY);
            hint.alpha = 0.5;
            hint.addTo(puzzleContainer, 0);
            piece.hint = hint;
            
            // Начальная позиция за пределами экрана
            piece.pos(-imageWidth, -imageHeight);
            
            return piece;
        }
        
        /**
         * Рисует форму кусочка пазла
         */
        function drawPieceShape(piece, params) {
            const { offsetX, offsetY, pieceWidth, pieceHeight, connections, image } = params;
            const graphics = piece.graphics;
            const curveSize = Math.round(pieceWidth / 8);
            
            graphics.setStrokeStyle(3, "round");
            graphics.beginStroke("#000000");
            graphics.beginBitmapFill(image);
            
            // Начинаем отрисовку
            graphics.moveTo(offsetX, offsetY);
            
            // Верхняя грань
            if (connections.top) {
                drawCurve(graphics, offsetX, offsetY, "top", connections.top, curveSize);
            }
            
            // Правая грань
            if (connections.right) {
                drawCurve(graphics, offsetX + pieceWidth, offsetY, "right", connections.right, curveSize);
            }
            
            // Нижняя грань
            if (connections.bottom) {
                drawCurve(graphics, offsetX + pieceWidth, offsetY + pieceHeight, "bottom", connections.bottom, curveSize);
            }
            
            // Левая грань
            if (connections.left) {
                drawCurve(graphics, offsetX, offsetY + pieceHeight, "left", connections.left, curveSize);
            }
            
            graphics.closePath();
        }
        
        /**
         * Рисует изогнутый край пазла
         */
        function drawCurve(graphics, x, y, side, type, curveSize) {
            // Реализация кривых Безье для создания формы пазла
            // (сохранена оригинальная логика, но вынесена в отдельную функцию)
        }
        
        /**
         * Показывает окно поздравления при завершении пазла
         */
        function showCongratulations() {
            const congratsWindow = new Pane({
                width: 600,
                height: 250,
                label: "Поздравляем!",
                modal: false,
                displayClose: false
            });
            
            const message = new Label({
                text: "Вы собрали пазл!",
                size: 30,
                color: "black"
            }).center(congratsWindow).mov(0, -40);
            
            const closeButton = new Button(120, 50, "OK", "green")
                .center(congratsWindow)
                .mov(0, 70);
                
            closeButton.on("click", function() {
                congratsWindow.hide();
            });
            
            congratsWindow.show();
        }
        
        /**
         * Вспомогательные функции
         */
        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        function getQueryString() {
            // Функция для получения параметров из URL
            // Например: ?rows=10&cols=10
            const params = {};
            const query = window.location.search.substring(1);
            const vars = query.split("&");
            
            for (let i = 0; i < vars.length; i++) {
                const pair = vars[i].split("=");
                params[pair[0]] = parseInt(pair[1]);
            }
            
            return params;
        }
    </script>
</body>
</html>
